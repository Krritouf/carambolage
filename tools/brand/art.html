<!doctype html>
<!-- The app's icon and splash, drawn in code in the game's look, shot to PNG in assets/:
     ?what=icon -> icon-only.png, ?what=fg -> icon-foreground.png, ?what=bg -> icon-background.png
     (1024 x 1024), ?what=splash -> splash.png (2732 x 2732). The icon is its own drawing (cartoon cars and
     fireball, icon()); tools/brand/icon-art.mjs shoots it. Then npm run android:assets.
     The title is 'ready' once it is drawn. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carambolage art</title>
<style>html, body { margin: 0; background: #1b1530; overflow: hidden; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const what = new URLSearchParams(location.search).get('what') || 'icon';
const S = what === 'splash' ? 2732 : 1024;
const cv = document.getElementById('c'); cv.width = S; cv.height = S; cv.style.width = S + 'px'; cv.style.height = S + 'px';
const g = cv.getContext('2d');
let seed = 11; const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
const poly = (pts, c) => { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) g.lineTo(p[0], p[1]); g.closePath(); g.fillStyle = c; g.fill(); };
const shade = (hex, f) => { const n = parseInt(hex.slice(1), 16); const c = s => Math.min(255, Math.round(((n >> s) & 255) * f)); return `rgb(${c(16)},${c(8)},${c(0)})`; };

// a box seen from above, its top lifted toward the viewer (the game's 2.5D)
function box(cx, cy, a, len, wid, h, top, side) {
  const c = Math.cos(a), s = Math.sin(a), hl = len / 2, hw = wid / 2;
  const pts = [[hl, hw], [hl, -hw], [-hl, -hw], [-hl, hw]].map(([u, v]) => [cx + c * u - s * v, cy + s * u + c * v]);
  const lift = [-h * 0.35, -h * 0.55];
  const tp = pts.map(p => [p[0] + lift[0], p[1] + lift[1]]);
  for (let i = 0; i < 4; i++) { const j = (i + 1) % 4; poly([pts[i], pts[j], tp[j], tp[i]], shade(side, 0.62 + 0.08 * i)); }
  poly(tp, top);
  return tp;
}
// a rectangle drawn flat on a lifted top: an offset (u along, v across) in the car's frame
function flat(cx, cy, a, u, v, len, wid, h, color) {
  const c = Math.cos(a), s = Math.sin(a), x = cx + c * u - s * v - h * 0.35, y = cy + s * u + c * v - h * 0.55, hl = len / 2, hw = wid / 2;
  poly([[hl, hw], [hl, -hw], [-hl, -hw], [-hl, hw]].map(([p, q]) => [x + c * p - s * q, y + s * p + c * q]), color);
}
function car(cx, cy, a, k, body, kind) {
  const L = 230 * k, Wd = 115 * k;
  g.globalAlpha = 0.35; box(cx + 26 * k, cy + 34 * k, a, L + 14 * k, Wd + 14 * k, 0, '#0b0818', '#0b0818'); g.globalAlpha = 1;
  box(cx, cy, a, L, Wd, 46 * k, body, body);
  const ch = 82 * k;
  box(cx - Math.cos(a) * 12 * k, cy - Math.sin(a) * 12 * k, a, L * 0.45, Wd * 0.82, ch, kind === 'taxi' ? '#22305a' : '#22305a', '#22305a');
  flat(cx, cy, a, -14 * k, 0, L * 0.32, Wd * 0.68, ch, shade(body, 1.12));
  flat(cx, cy, a, L / 2 - 10 * k, Wd * 0.3, 14 * k, 22 * k, 46 * k, '#fff3bf'); flat(cx, cy, a, L / 2 - 10 * k, -Wd * 0.3, 14 * k, 22 * k, 46 * k, '#fff3bf');
  if (kind === 'player') { // racing stripes and a spoiler
    for (const v of [-11, 11]) { flat(cx, cy, a, L * 0.3, v * k, L * 0.36, 11 * k, 46 * k, '#ffffff'); flat(cx, cy, a, -14 * k, v * k, L * 0.32, 11 * k, ch, '#ffffff'); }
    flat(cx, cy, a, -L * 0.4, 0, 18 * k, Wd * 0.95, 48 * k, '#1d1a26');
  } else { // the taxi's roof sign
    box(cx - Math.cos(a) * 14 * k, cy - Math.sin(a) * 14 * k, a, 30 * k, 58 * k, ch + 26 * k, '#ffffff', '#ced4da');
  }
}
function burst(cx, cy, r) {
  const ring = (rr, n, c, rot) => { const p = []; for (let i = 0; i < n * 2; i++) { const an = rot + i * Math.PI / n, q = i % 2 ? rr * 0.5 : rr * (0.85 + rnd() * 0.3); p.push([cx + Math.cos(an) * q, cy + Math.sin(an) * q]); } poly(p, c); };
  ring(r, 12, '#ff4a1c', 0.1); ring(r * 0.78, 11, '#ff9a1f', 0.3); ring(r * 0.52, 9, '#ffe066', 0.5); ring(r * 0.28, 8, '#fffbe0', 0.2);
}
function sparks(cx, cy, r, n, px) {
  const cols = ['#fffbe0', '#ffe066', '#ff9a1f', '#ff4a1c'];
  for (let i = 0; i < n; i++) {
    const an = rnd() * Math.PI * 2, d = r * (0.7 + rnd() * 0.9), x = Math.round((cx + Math.cos(an) * d) / px) * px, y = Math.round((cy + Math.sin(an) * d) / px) * px;
    g.fillStyle = cols[Math.floor(rnd() * cols.length)]; g.fillRect(x, y, px, px);
    if (rnd() < 0.5) g.fillRect(x + px, y, px, px);
  }
  for (let i = 0; i < n / 4; i++) { // debris
    const an = rnd() * Math.PI * 2, d = r * (0.9 + rnd() * 0.6), x = cx + Math.cos(an) * d, y = cy + Math.sin(an) * d, s = px * (1.5 + rnd() * 2);
    poly([[x, y - s], [x + s, y + s * 0.6], [x - s * 0.8, y + s * 0.4]], rnd() < 0.5 ? '#ff2d2d' : '#ffd21f');
  }
}
function city() { // the game's crossroads: a boulevard across the middle, blocks in rows above and below
  const pal = ['#ff5e7a', '#2ec4b6', '#ffc83d', '#7b5cff', '#ff8fd0', '#19c37d', '#4aa8ff', '#ff7b39'];
  const road = 760, y0 = S / 2 - road / 2 + 90, y1 = y0 + road;
  g.fillStyle = '#e9d8a6'; g.fillRect(0, y0 - 60, S, road + 120); // sidewalks
  g.fillStyle = '#4b5577'; g.fillRect(0, y0, S, road);
  g.fillStyle = '#ffd21f'; g.fillRect(0, (y0 + y1) / 2 - 10, S, 7); g.fillRect(0, (y0 + y1) / 2 + 6, S, 7);
  g.fillStyle = '#f1f3f5'; for (const f of [0.25, 0.75]) for (let x = 0; x < S; x += 160) g.fillRect(x, y0 + road * f - 4, 90, 8);
  const row = (top, bottom) => {
    for (let x = -40; x < S; ) {
      const w = 300 + rnd() * 260, c = pal[Math.floor(rnd() * pal.length)];
      box(x + w / 2, (top + bottom) / 2, 0, w - 50, bottom - top - 50, 120 + rnd() * 160, c, c);
      x += w;
    }
  };
  row(0, y0 - 80); row(y1 + 80, S);
}
// ---- the icon: two cartoon cars meeting in a fireball, drawn for its own sake (not the game's sprites) --------
// round shapes, a dark outline round everything, light from the top left and from the fire, so it reads at 48 px
const INK = '#1b1530';
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function lin(x0, y0, x1, y1, stops) { const l = g.createLinearGradient(x0, y0, x1, y1); stops.forEach(([o, c]) => l.addColorStop(o, c)); return l; }
function rad(x, y, r0, r1, stops, fx, fy) { const l = g.createRadialGradient(fx ?? x, fy ?? y, r0, x, y, r1); stops.forEach(([o, c]) => l.addColorStop(o, c)); return l; }
/** The boulevard, across the icon along angle a: tarmac, kerbs, a double yellow line, white dashes. */
function iconRoad(cx, cy, a) {
  g.save(); g.translate(cx, cy); g.rotate(a);
  const w = 430, len = 2000;
  g.fillStyle = '#e2cf9a'; g.fillRect(-len / 2, -w / 2 - 34, len, w + 68);            // pavements
  g.fillStyle = lin(0, -w / 2, 0, w / 2, [[0, '#4d5578'], [0.5, '#555e84'], [1, '#444b6c']]); g.fillRect(-len / 2, -w / 2, len, w);
  g.fillStyle = '#ffd21f'; g.fillRect(-len / 2, -9, len, 7); g.fillRect(-len / 2, 4, len, 7); // the double yellow line
  g.fillStyle = 'rgba(241,243,245,0.85)'; for (let x = -len / 2; x < len / 2; x += 120) { g.fillRect(x, -w / 4 - 4, 64, 8); g.fillRect(x + 50, w / 4 - 4, 64, 8); }
  g.restore();
}
/** A car seen from above, front towards +x, centred on (cx, cy), turned by a; kind 'sport' or 'taxi'; lift raises it
 *  off the road (a bigger, softer shadow further off; drawn a little bigger). */
function toonCar(cx, cy, a, L, kind, lift = 0) {
  const W = L * 0.5, body = kind === 'taxi' ? ['#fff07a', '#ffc81f', '#d99200'] : ['#ff7368', '#f0262b', '#9e0f1a'];
  g.save(); g.translate(cx, cy);
  // its shadow, on the road: further off and softer the higher it is
  g.save(); g.rotate(a); g.filter = `blur(${12 + lift * 30}px)`; g.fillStyle = `rgba(10,6,24,${0.6 - lift * 0.25})`;
  rr(-L / 2 + 16 + lift * 40, -W / 2 + 26 + lift * 70, L, W, W * 0.32); g.fill(); g.restore();
  g.scale(1 + lift * 0.1, 1 + lift * 0.1); g.rotate(a);
  // the wheels, peeking out under the arches
  for (const u of [-0.29, 0.31]) for (const v of [-1, 1]) {
    rr(L * u - L * 0.095, v * W * 0.5 - W * 0.12, L * 0.19, W * 0.24, 14); g.fillStyle = '#17131f'; g.fill();
    rr(L * u - L * 0.06, v * W * 0.5 - W * 0.05, L * 0.12, W * 0.1, 6); g.fillStyle = '#3a3550'; g.fill();
  }
  // mirrors
  for (const v of [-1, 1]) { rr(L * 0.08, v * (W / 2 + 6) - 9, 26, 18, 8); g.fillStyle = body[2]; g.fill(); g.lineWidth = 6; g.strokeStyle = INK; g.stroke(); }
  // the body: its side (darker) under its top, then bumpers
  g.lineWidth = 12; g.strokeStyle = INK; g.lineJoin = 'round';
  rr(-L / 2, -W / 2, L, W, W * 0.34); g.fillStyle = body[2]; g.fill(); g.stroke();
  rr(-L / 2 + 8, -W / 2 + 6, L - 16, W - 24, W * 0.3); g.fillStyle = lin(0, -W / 2, 0, W / 2, [[0, body[0]], [0.5, body[1]], [1, body[2]]]); g.fill();
  g.fillStyle = '#d9dde8'; rr(L / 2 - 14, -W * 0.36, 10, W * 0.72, 5); g.fill(); rr(-L / 2 + 4, -W * 0.34, 10, W * 0.68, 5); g.fill();
  // the bonnet crumpled by the crash: a jagged crease and a dark dent
  g.fillStyle = 'rgba(40,10,20,0.28)'; g.beginPath(); g.moveTo(L * 0.3, -W * 0.38);
  for (let i = 0; i <= 6; i++) g.lineTo(L * (0.3 + (i % 2) * 0.07), -W * 0.38 + i * W * 0.12);
  g.lineTo(L * 0.46, W * 0.34); g.lineTo(L * 0.46, -W * 0.38); g.closePath(); g.fill();
  g.strokeStyle = INK; g.lineWidth = 5; g.lineCap = 'round'; g.beginPath(); g.moveTo(L * 0.3, -W * 0.38);
  for (let i = 0; i <= 6; i++) g.lineTo(L * (0.3 + (i % 2) * 0.07), -W * 0.38 + i * W * 0.12); g.stroke();
  if (kind === 'sport') { // two white racing stripes, nose to tail
    g.fillStyle = '#ffffff'; for (const v of [-0.115, 0.025]) { rr(-L / 2 + 12, v * W, L * 0.78, W * 0.09, 6); g.fill(); }
  } else { // the taxi's chequered band down both sides
    const n = 12, cw = (L * 0.6) / n;
    for (const v of [-1, 1]) for (let i = 0; i < n; i++) for (let j = 0; j < 2; j++) {
      g.fillStyle = (i + j) % 2 ? '#1d1a26' : '#ffffff';
      g.fillRect(-L * 0.32 + i * cw, v > 0 ? W * 0.25 + j * cw * 0.7 : -W * 0.39 + j * cw * 0.7, cw, cw * 0.7);
    }
  }
  // the cabin: dark glass all round, the roof on top, a shine on both
  const cx0 = -L * 0.2, cl = L * 0.44, cw0 = W * 0.72;
  rr(cx0, -cw0 / 2 - W * 0.05, cl, cw0, 32); g.fillStyle = lin(cx0, 0, cx0 + cl, 0, [[0, '#33407a'], [1, '#141c40']]); g.fill();
  g.lineWidth = 7; g.strokeStyle = INK; g.stroke();
  g.fillStyle = 'rgba(200,228,255,0.6)'; g.beginPath(); g.moveTo(cx0 + cl - 30, -cw0 * 0.44); g.lineTo(cx0 + cl - 12, -cw0 * 0.44); g.lineTo(cx0 + cl - 40, cw0 * 0.32); g.lineTo(cx0 + cl - 58, cw0 * 0.32); g.closePath(); g.fill();
  rr(cx0 + cl * 0.18, -cw0 * 0.36 - W * 0.05, cl * 0.56, cw0 * 0.72, 20); g.fillStyle = lin(0, -cw0 / 2, 0, cw0 / 2, [[0, body[0]], [1, body[1]]]); g.fill();
  if (kind === 'sport') { g.fillStyle = '#ffffff'; for (const v of [-0.115, 0.025]) { rr(cx0 + cl * 0.18, v * W, cl * 0.56, W * 0.09, 4); g.fill(); } }
  else { // the roof sign
    rr(cx0 + cl * 0.34, -W * 0.22, cl * 0.25, W * 0.34, 8); g.fillStyle = '#ffffff'; g.fill(); g.lineWidth = 5; g.strokeStyle = INK; g.stroke();
    g.fillStyle = '#1d1a26'; g.font = 'bold ' + Math.round(W * 0.13) + 'px "Trebuchet MS", Verdana, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.save(); g.translate(cx0 + cl * 0.465, -W * 0.05); g.rotate(Math.PI / 2); g.fillText('TAXI', 0, 0); g.restore();
  }
  // a gloss: a soft white sheen along the top of the body
  g.save(); g.globalAlpha = 0.45; g.fillStyle = lin(0, -W / 2, 0, -W * 0.2, [[0, 'rgba(255,255,255,0.9)'], [1, 'rgba(255,255,255,0)']]);
  rr(-L * 0.44, -W * 0.44, L * 0.6, W * 0.18, 20); g.fill(); g.restore();
  // lights: the headlamps glowing at the front, red ones at the back
  g.save(); g.shadowColor = '#fff2a8'; g.shadowBlur = 26; g.fillStyle = '#fffbe0';
  for (const v of [-1, 1]) { rr(L / 2 - 24, v * W * 0.3 - 13, 16, 26, 7); g.fill(); }
  g.restore(); g.fillStyle = '#ff3355'; for (const v of [-1, 1]) { rr(-L / 2 + 8, v * W * 0.3 - 12, 12, 24, 6); g.fill(); }
  g.restore();
}
/** Speed lines trailing behind a car coming along angle a towards (x, y). */
function speedLines(x, y, a, n, from, to) {
  g.save(); g.translate(x, y); g.rotate(a); g.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const v = (i - (n - 1) / 2) * 34, x0 = -from - rnd() * 40, x1 = -to - rnd() * 60;
    g.strokeStyle = lin(x0, 0, x1, 0, [[0, 'rgba(255,255,255,0.55)'], [1, 'rgba(255,255,255,0)']]); g.lineWidth = 8;
    g.beginPath(); g.moveTo(x0, v); g.lineTo(x1, v); g.stroke();
  }
  g.restore();
}
/** Round puffs, each shaded on its own, outlined together as one shape. */
function puffs(list, light, mid, dark, ink) {
  g.lineWidth = ink; g.strokeStyle = INK;
  for (const [px, py, r] of list) { g.beginPath(); g.arc(px, py, r, 0, Math.PI * 2); g.stroke(); }
  for (const [px, py, r] of list) {
    g.beginPath(); g.arc(px, py, r, 0, Math.PI * 2);
    g.fillStyle = rad(px, py, r * 0.05, r, [[0, light], [0.55, mid], [1, dark]], px - r * 0.35, py - r * 0.4); g.fill();
  }
}
function ring(x, y, n, dist, r0, r1, rot) {
  const out = []; for (let i = 0; i < n; i++) { const an = rot + i * Math.PI * 2 / n + (rnd() - 0.5) * 0.3, d = dist * (0.85 + rnd() * 0.3); out.push([x + Math.cos(an) * d, y + Math.sin(an) * d, r0 + rnd() * (r1 - r0)]); }
  return out;
}
/** A round cartoon fireball: a glow, puffs of smoke, curling flames, a hot core. */
function fireball(x, y, R) {
  // the glow lighting everything round
  g.save(); g.globalCompositeOperation = 'lighter';
  g.fillStyle = rad(x, y, 0, R * 2.6, [[0, 'rgba(255,190,80,0.55)'], [0.4, 'rgba(255,120,40,0.22)'], [1, 'rgba(255,90,30,0)']]);
  g.fillRect(x - R * 3, y - R * 3, R * 6, R * 6); g.restore();
  // smoke behind
  puffs(ring(x, y, 10, R * 0.86, R * 0.22, R * 0.3, 0.3), '#9a8cc0', '#6a5c92', '#43375f', 12);
  // flames licking out: wide at the fire, a round tip, bent a little
  // uneven on purpose: long ones and short ones, not evenly spaced, so it burns rather than blooms
  const FL = [[0.2, 1.35, 0.3], [1.05, 0.95, 0.24], [1.75, 1.25, 0.28], [2.6, 0.9, 0.22], [3.25, 1.3, 0.3], [4.0, 1.0, 0.25], [4.75, 1.4, 0.29], [5.5, 0.88, 0.22]];
  for (const [an0, k, wk] of FL) {
    const an = an0 + (rnd() - 0.5) * 0.2, len = R * k, wid = R * wk, tr = wid * 0.42, bend = (rnd() - 0.5) * 0.9;
    g.save(); g.translate(x, y); g.rotate(an);
    g.beginPath(); g.moveTo(R * 0.3, -wid);
    g.bezierCurveTo(len * 0.55, -wid * 1.25, len - tr * 1.2, -tr * 1.3 + bend * tr, len - tr, -tr + bend * tr);
    g.arc(len - tr, bend * tr, tr, -Math.PI / 2, Math.PI / 2);
    g.bezierCurveTo(len - tr * 1.2, tr * 1.3 + bend * tr, len * 0.55, wid * 1.25, R * 0.3, wid); g.closePath();
    g.lineWidth = 11; g.strokeStyle = INK; g.lineJoin = 'round'; g.stroke();
    g.fillStyle = lin(R * 0.3, 0, len, 0, [[0, '#ffd35a'], [0.5, '#ff8a1f'], [1, '#ff4a1c']]); g.fill();
    // a lighter lick inside each flame
    g.beginPath(); g.ellipse(len * 0.62, bend * tr * 0.5, len * 0.22, wid * 0.32, 0, 0, Math.PI * 2); g.fillStyle = 'rgba(255,230,140,0.55)'; g.fill();
    g.restore();
  }
  // the fire: round puffs, each lit from the top left, hot in the middle
  puffs(ring(x, y, 9, R * 0.45, R * 0.3, R * 0.4, 0), '#fff4b0', '#ffb43a', '#ff5a1c', 12);
  puffs(ring(x, y, 6, R * 0.2, R * 0.2, R * 0.26, 0.5), '#ffffff', '#fff1a0', '#ffc94a', 0);
  g.save(); g.globalCompositeOperation = 'lighter';
  g.fillStyle = rad(x, y, 0, R * 0.5, [[0, 'rgba(255,255,240,0.9)'], [1, 'rgba(255,255,200,0)']]); g.fillRect(x - R, y - R, R * 2, R * 2);
  g.restore();
}
/** Glowing sparks shooting out with a tail, glass shards and a few bits of car flying. */
function sparksAndBits(x, y, R) {
  g.save(); g.lineCap = 'round'; g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 26; i++) {
    const an = rnd() * Math.PI * 2, d0 = R * (1.0 + rnd() * 0.3), d1 = d0 + R * (0.18 + rnd() * 0.3);
    const x0 = x + Math.cos(an) * d0, y0 = y + Math.sin(an) * d0, x1 = x + Math.cos(an) * d1, y1 = y + Math.sin(an) * d1;
    g.strokeStyle = lin(x0, y0, x1, y1, [[0, 'rgba(255,170,40,0)'], [1, rnd() < 0.5 ? '#fff6c2' : '#ffd23f']]); g.lineWidth = 6 + rnd() * 6;
    g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    g.fillStyle = '#fffbe0'; g.beginPath(); g.arc(x1, y1, g.lineWidth * 0.6, 0, Math.PI * 2); g.fill();
  }
  g.restore();
  for (let i = 0; i < 9; i++) { // glass, glinting
    const an = rnd() * Math.PI * 2, d = R * (1.15 + rnd() * 0.45), bx = x + Math.cos(an) * d, by = y + Math.sin(an) * d, s = R * (0.04 + rnd() * 0.04);
    g.save(); g.translate(bx, by); g.rotate(rnd() * 6);
    g.beginPath(); g.moveTo(0, -s * 1.3); g.lineTo(s, s * 0.8); g.lineTo(-s * 0.9, s * 0.6); g.closePath();
    g.fillStyle = 'rgba(205,235,255,0.9)'; g.fill(); g.lineWidth = 3; g.strokeStyle = 'rgba(27,21,48,0.8)'; g.stroke(); g.restore();
  }
  const bits = [['#f0262b', -2.5, 1.45], ['#ffc81f', 0.75, 1.5], ['#ffc81f', -1.0, 1.42], ['#f0262b', 2.6, 1.36]];
  for (const [c, an, k] of bits) {
    const bx = x + Math.cos(an) * R * k, by = y + Math.sin(an) * R * k, s = R * 0.1;
    g.save(); g.translate(bx, by); g.rotate(an * 3);
    g.beginPath(); g.moveTo(-s, -s * 0.6); g.quadraticCurveTo(0, -s * 1.1, s * 0.9, -s * 0.7); g.lineTo(s * 0.7, s * 0.7); g.quadraticCurveTo(0, s * 0.9, -s * 0.8, s * 0.5); g.closePath();
    g.lineWidth = 7; g.strokeStyle = INK; g.lineJoin = 'round'; g.stroke(); g.fillStyle = c; g.fill(); g.restore();
  }
  // a wheel come off, rolling away
  const wx = x + Math.cos(1.0) * R * 1.75, wy = y + Math.sin(1.0) * R * 1.75, wr = R * 0.17;
  g.beginPath(); g.arc(wx, wy, wr, 0, Math.PI * 2); g.fillStyle = '#17131f'; g.fill(); g.lineWidth = 7; g.strokeStyle = INK; g.stroke();
  g.beginPath(); g.arc(wx, wy, wr * 0.5, 0, Math.PI * 2); g.fillStyle = rad(wx, wy, 0, wr * 0.5, [[0, '#e8ebf2'], [1, '#8b93a8']], wx - wr * 0.2, wy - wr * 0.2); g.fill();
}
