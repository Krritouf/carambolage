<!doctype html>
<!-- The Play Store feature graphic (1024 x 500): the title and the tagline on the left, over a real
     pile-up with the T-Rex on the right. ?lang=fr or ?lang=en; it reads shots/bg.png, shot by
     tools/brand/store-art.mjs, which also shoots this page to store/. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carambolage store art</title>
<style>html, body { margin: 0; background: #1b1530; overflow: hidden; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'fr';
const W = 1024, H = 500;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const g = cv.getContext('2d');
const load = src => new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = src; });
let bg;
load('shots/bg.png').then(b => { bg = b; draw(); });
function draw() {
  // the pile-up, darkened, darker still under the words
  const s = Math.max(W / bg.width, H / bg.height);
  g.drawImage(bg, (W - bg.width * s) / 2, (H - bg.height * s) / 2, bg.width * s, bg.height * s);
  g.fillStyle = 'rgba(27,21,48,0.18)'; g.fillRect(0, 0, W, H);
  const fade = g.createLinearGradient(0, 0, 620, 0); fade.addColorStop(0, 'rgba(27,21,48,0.95)'); fade.addColorStop(0.65, 'rgba(27,21,48,0.8)'); fade.addColorStop(1, 'rgba(27,21,48,0)');
  g.fillStyle = fade; g.fillRect(0, 0, 620, H);

  // the title and the tagline
  g.save(); g.translate(52, 175); g.rotate(-0.05);
  g.font = 'italic bold 60px "Trebuchet MS", "Arial Black", Verdana, sans-serif'; g.textBaseline = 'middle';
  g.lineWidth = 10; g.lineJoin = 'round'; g.strokeStyle = '#1b1530'; g.strokeText('CARAMBOLAGE', 0, 0);
  g.fillStyle = '#ffc83d'; g.fillText('CARAMBOLAGE', 0, 0); g.restore();
  const lines = lang === 'en' ? ['One crash.', 'The biggest pile-up', 'you can make.'] : ['Un seul choc.', 'Le plus gros carambolage', 'possible.'];
  g.font = 'bold 30px "Trebuchet MS", Verdana, sans-serif'; g.textBaseline = 'middle';
  lines.forEach((l, i) => { g.lineWidth = 6; g.strokeStyle = '#1b1530'; g.strokeText(l, 58, 262 + i * 40); g.fillStyle = '#ffffff'; g.fillText(l, 58, 262 + i * 40); });
  g.font = 'bold 20px "Trebuchet MS", Verdana, sans-serif';
  const tag = lang === 'en' ? '5 countries · 100 levels · T-Rex · shops to wreck' : '5 pays · 100 niveaux · T-Rex · commerces à démolir';
  g.lineWidth = 5; g.strokeStyle = '#1b1530'; g.strokeText(tag, 58, 400); g.fillStyle = '#ff9fb2'; g.fillText(tag, 58, 400);
  document.title = 'ready';
}
</script>
</body>
</html>
