# Where each file in assets/ and vendor/ came from, one entry per file. The field names are the
# provenance record's, so the entries carry over when the game grows.
# - path: assets/hit.wav      # relative to this game's folder
#   origin: ai                # ai | bought | cc0 | you | outsourced | template | plugin | licensed | code | unknown
#   tool: "what made or fetched it: the generator, or the script for code"
#   model: "the model ID, when a model made it or an AI wrote its code"
#   source: {vendor: "who made or sold it", product: "its name", url: "where from"}   # a download
#   licence: {id: CC0-1.0}    # a download: the SPDX id where one exists
#   date: 2026-01-31
#   ships: true               # false for a file only the build uses
#   placeholder: true         # until it is replaced; leave the line out otherwise

- path: assets/icon-only.png
  origin: code
  tool: "tools/brand/art.html?what=icon, shot at 1024 x 1024; npm run android:assets makes the Android sizes"
- path: assets/splash.png
  origin: code
  tool: "tools/brand/art.html?what=splash, shot at 2732 x 2732; npm run android:assets makes the Android sizes"
- path: assets/icon-foreground.png
  origin: code
  tool: "tools/brand/art.html?what=fg, shot at 1024 x 1024 (the adaptive icon's foreground)"
- path: assets/icon-background.png
  origin: code
  tool: "tools/brand/art.html?what=bg, shot at 1024 x 1024 (the adaptive icon's background)"
- path: assets/apple-touch-icon.png
  origin: code
  tool: "copy of android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png (192 x 192, made by npm run android:assets): the iPhone home-screen icon"
